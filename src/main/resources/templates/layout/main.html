<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Giao dịch nhà đất</title>
    <link rel="icon" type="image/jpeg" href="https://codegym.vn/wp-content/uploads/2018/07/icon-small.jpeg">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="app-header">
    <div class="container app-header-inner">
        <a class="app-brand" th:href="@{/giao-dich}">
            <img class="app-logo" src="https://codegym.vn/wp-content/uploads/2018/07/icon-small.jpeg" alt="CodeGym">
            <span>Quản lý giao dịch nhà đất</span>
        </a>
    </div>
</header>
<main class="container app-main">
    <div class="alert alert-success" th:if="${thongBao}" th:text="${thongBao}"></div>
    <th:block th:replace="${content}"></th:block>
</main>
<footer class="app-footer">
    <div class="container">CodeGym - Raising the bar</div>
</footer>
</body>
</html>
